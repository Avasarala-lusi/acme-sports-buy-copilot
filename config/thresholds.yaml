# Every business threshold lives here (spec section 8.3: no hardcoded thresholds).
# Client decisions (confirmed Oct 5, 2026) are marked [client].
# Team assumptions awaiting confirmation are marked [assumption].

data:
  raw_dir: data/raw
  output_dir: outputs
  weeks_used: all                # [client] use all 100 weeks, not 52
  dtc_as_single_customer: false  # data v5 names every DTC account (ACME own channels, key accounts); the earlier
                                 # client decision to treat DTC as one customer was for anonymous DTC ids

buying_window:
  frequency: monthly             # [client] one buying window per month, in the third week
  week_of_month: 3               # [assumption] third week = days 15-21; the buying run is the run whose PO date falls there
  po_weekday: 2                  # PO execution weekday in the data (0 = Monday, 2 = Wednesday)
  weekly_drafts: true            # [assumption] runs outside the buying window show a draft of it; nothing is committed
  lookahead_windows: 4           # spec 3.3: project load over the next 4 windows

capacity:
  backup_threshold_pct: 85       # spec 3.2: route to backup when the factory is >= 85% consumed
  source: rolling_ledger         # [client] recompute from our own assignments, not fact_factory_utilization
  spread_over_manufacturing: true  # [assumption] a lot's units are spread evenly over its manufacturing weeks
  hard_limit_pct: 100            # [assumption] a factory week can never be loaded beyond this (confirm: overtime?)
  when_no_capacity: planner_review  # [assumption] planner_review | buy_with_warning; when no certified option has room

lead_times:
  other_factory: midpoint        # [assumption] lead time at a factory other than the PR's own = midpoint of the factory's min/max

quantities:
  moq_per_market: 300            # spec rule 3
  mpq:
    apparel: 1200
    footwear: 2400

grouping:
  window_days: 15                # spec rule 2
  mode: anchor                   # anchor | chain  (open question, see Trello Blockers)

piggyback:
  tolerance_pct: 5               # spec rule 4: auto-trigger within 5% of the threshold

carry_forward:
  wait_if_not_late: true         # [assumption] a lot below MOQ/MPQ waits for the next run if it can still start on time

last_chance:
  include_forecast_only: true    # [assumption] catalogue is closing, so buy all outstanding demand
  on_quantity_shortfall: warn    # [client] warn, don't block
  on_capacity_conflict: warn     # [client] warn, don't block

backup_source: factory_chain     # [assumption] factory_chain | factory | article. Data v5: every supplied backup
                                 # assignment walks the factory chain (backup, its backup, ... to CN04, the last resort)
