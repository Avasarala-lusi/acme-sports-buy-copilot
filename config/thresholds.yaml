# Every business threshold lives here (spec section 8.3: no hardcoded thresholds).
# Client decisions (confirmed Oct 5, 2026) are marked [client].
# Team assumptions awaiting confirmation are marked [assumption].

data:
  raw_dir: data/raw
  output_dir: outputs
  weeks_used: all                # [client] use all 100 weeks, not 52
  dtc_as_single_customer: false  # data v5 names every DTC account (ACME own channels, key accounts); the earlier
                                 # client decision to treat DTC as one customer was for anonymous DTC ids

buying_window:
  frequency: semi_monthly        # latest MID/EOM interpretation; replaces earlier monthly default
  mid_cutoff_day: 15             # assumption: latest Wednesday on/before this cutoff
  max_pull_forward_windows: 4    # count windows, not a fixed 56 days
  week_of_month: 3               # [assumption] third week = days 15-21; the buying run is the run whose PO date falls there
  po_weekday: 2                  # PO execution weekday in the data (0 = Monday, 2 = Wednesday)
  weekly_drafts: true            # [assumption] runs outside the buying window show a draft of it; nothing is committed
  lookahead_windows: 4           # spec 3.3: project load over the next 4 windows

priority:
  tie_break: rdd_then_revenue    # [client, Oct 29] equal release dates: earliest RDD, highest NSV, order-backed first

date_policy:
  manufacturing_duration: calendar_days
  interval: start_inclusive_completion_exclusive
  holidays: none

capacity:
  backup_threshold_pct: 85       # spec 3.2: route to backup when the factory is >= 85% consumed
  source: rolling_ledger         # [client] recompute from our own assignments, not fact_factory_utilization
  spread_over_manufacturing: true  # [client] business-day-proportional capacity in the production interval
  hard_limit_pct: 100            # [client] no automatic or manual purchase may assume overtime
  when_no_capacity: planner_review  # [client] keep demand visible and show failed checks
  retried_late_demand: planner_review  # planner_review | buy: retried review/unresolved demand whose release date
                                 # has passed stays in review (would arrive late) instead of an automatic late purchase

lead_times:
  other_factory: midpoint        # [client] arithmetic midpoint; estimated source shown

quantities:
  moq_per_market: 300            # spec rule 3
  mpq:
    apparel: 1200
    footwear: 2400
  # MPQ group: rdd_band = article/factory/window within one 15-day RDD span (current);
  # purchase = one production order per article/factory/window (proposed to the client, Oct 29)
  mpq_scope: rdd_band

grouping:
  window_days: 15                # spec rule 2
  mode: anchor                   # strict earliest-to-latest 15-day span; no chaining

piggyback:
  tolerance_pct: 5               # spec rule 4: auto-trigger within 5% of the threshold

carry_forward:
  wait_if_not_late: true         # [assumption] a lot below MOQ/MPQ waits for the next run if it can still start on time

last_chance:
  include_forecast_only: false   # conflicting last-chance/unconfirmed demand requires planner review
  on_quantity_shortfall: warn    # [client] warn, don't block
  on_capacity_conflict: planner_review  # priority never waives the 100% hard ceiling

backup_source: factory_chain     # [client] matrix certification gates each factory-chain step
                                 # assignment walks the factory chain (backup, its backup, ... to CN04, the last resort)

forecast:
  model: stage_seasonal          # stage_seasonal | sarimax | random_forest | xgboost | extra_trees | gradient_boosting | seasonal_naive | moving_average
  horizon_weeks: 17             # team evaluation horizon; separate from four semi-monthly load windows (~8 weeks)
  calibration_origins: 6        # rolling past-only forecasts for the selected model's uncertainty range
  calibration_step: 4
  backtest_step: 4
  holdout_weeks: 17             # final period excluded from model selection
  default_release_lag_weeks: 13 # assumption only when a factory has no known eligible PR history

features:
  experimental: false           # upcoming work: optimizer, simulated on-time risk, disruption drill, benchmark, data health

impact:
  price_per_unit_usd: 21         # [client] average price per unit to value late or undelivered units ($19-22 also fine)

risk:                            # [assumption] lead-time variation for on-time probability
  simulations: 20000             # draws per factory for the delay distribution
  early_share_of_range: 0.25     # a lot can finish up to 25% of the factory's quoted lead-time range early
  late_share_of_range: 0.5       # ... and run up to 50% of the range late (delays are larger than gains)
  seed: 7

optimizer:                       # network planning: all certified factories together, 100% weekly capacity
  # weight: 0 = cheapest plan, 1 = safest plan (most units expected on time); the recommended one comes from the benchmark
  time_limit_s: 20               # the gap to the best possible plan is under 1% by then
  mip_gap: 0.005
  enforce_mpq: true              # one production order per article/factory/window must reach MPQ
  backup_penalty_per_unit: 0.1   # [assumption] a backup factory must save >10% of unit cost (or lateness) to be chosen

benchmark:
  tuning_seasons: [FW25, SS26]   # the optimiser's recommended weight is chosen on these seasons only
  test_seasons: [FW26, SS27]     # results are reported on seasons not used for tuning
  weights: [0.0, 0.25, 0.5, 0.75, 1.0]

data_health:
  qty_robust_z: 5                # requisition quantity unusual for its article (robust z-score)
  volume_change_pct: 60          # run intake differs from the trailing median of 8 runs by more than this
  rdd_horizon_days: 400          # RDD further out than this from the MRP run date
